<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Aqui defino el título de la página <title>Hero ViajaYa - Lizeth</title>-->
    <title>Hero ViajaYa - Lizeth</title>

    <!------------------------------------------------------------->
    <!-- Aqui inicio con los stilos CSS del HERO VIAJAYA X LIZETH-->
    <style>
        /* Aquí Se cuardaron los colores y la transición principal del proyecto */
        :root {

            /* Guardo el color azul principal que usaré en el botón */
            --color-primario: #2563eb;

            /* Guardo un azul más oscuro para cuando el usuario pase el cursor */
            --color-primario-hover: #1d4ed8;

            /* Guardo el color principal de los textos */
            --color-texto: #1e293b;

            /* Guardo el color claro del fondo general de la página */
            --color-fondo: #f8fafc;

            /* Guardo un color suave para bordes, aunque todavía no lo uso */
            --color-borde: #e2e8f0;

            /* Guardo la duración y el tipo de transición de los efectos */
            --transicion-suave: 0.3s ease;
        }

        /* Ahora quito los espacios que trae el navegador por defecto */
        * {

            /* Aqui se quita el espacio exterior de todos los elementos */
            margin: 0;

            /* Aqui se define el espacio interior de todos los elementos */
            padding: 0;

            /* Aqui se hace que el ancho y el alto incluyan 
            el padding y el borde del elemento*/
            box-sizing: border-box;
        }

        /* Y se definen los estilos generales  para el hero */
        body {

            /* Se usa Arial como fuente principal y Si no está 
            disponible, se usa Helvetica o una fuente sans-serif*/
            font-family: Arial, Helvetica, sans-serif;

            /* Aqui se coloca el color de fondo usando la variable del proyecto */
            background-color: var(--color-fondo);

            /* Aqui se coloca el color general de los textos usando otra variable */
            color: var(--color-texto);

        }

        /* Aqui se crea la seccion principal del hero */
        .hero {

            /* Se le da una altura mínima de 620 píxeles */
            min-height: 620px;


            /* Se usa Flexbox para centrar el contenido */
            display: flex;

            /* Se centra el contenido horizontalmente */
            justify-content: center;

            /* Se centra el contenido verticalmente */
            align-items: center;

            /* Agrego 40 píxeles de espacio arriba y abajo 
            y 20 píxeles a los lados*/
            padding: 40px 20px;

            /* Se coloca una capa oscura sobre la imagen para leer mejor el texto */
            background-image:

                /* Se crea una capa oscura para que el texto 
                blanco se pueda leer mejor */
                linear-gradient(rgba(15, 23, 42, 0.38),
                    rgba(15, 23, 42, 0.38)),

                /* Se coloca la imagen principal que tengo 
                guardada en la carpeta img*/
                url("img/fondo-viajes.png");


            /* Ahora se hace que la imagen cubra todo el HERO */
            background-size: cover;

            /* Ahora centro la parte más importante de la imagen */
            background-position: center;

            /* Ahora evito que la imagen se repita */
            background-repeat: no-repeat;


        }

        /* Ahora aqui se organiza el título, el texto y el botón en 
        una columna */
        .contenedor-hero {

            /* Se hace que el contenedor use todo el ancho disponible */
            width: 100%;

            /* Se limito el ancho para que el contenido no se extienda demasiado */
            max-width: 900px;

            /* Se activo Flexbox para organizar los elementos */
            display: flex;

            /* Se coloco el título, el texto y el botón uno debajo del otro */
            flex-direction: column;

            /* Se centran los elementos de forma horizontal */
            align-items: center;

            /* Se centra el contenido de texto */
            text-align: center;

            /* Se centro el texto en color blanco */
            color: white;

            /* Se agrega una sombra al texto para que se lea
            bien sin oscureccer tanto la imagen*/
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);

        }

        /* Se diseña el título principal */
        .titulo-hero {

            /* Se limito el ancho del título para controlar mejor sus líneas */
            max-width: 850px;

            /* Se agrego el espacio debajo del título */
            margin-bottom: 28px;

            /* Se le da un tamaño grande al título */
            font-size: 4rem;

            /* Se ajusta el espacio entre las líneas del título */
            line-height: 1.2;

        }

        /* Se diseña el texto descriptivo */
        .descripcion-hero {

            /* Se limito el ancho para que el texto no quede demasiado extendido */
            max-width: 700px;

            /* Se agrega el espacio debajo del texto para separarlo del botón */
            margin-bottom: 35px;

            /* Se le da un tamaño de fuente moderado al texto descriptivo */
            font-size: 1.35rem;

            /* Se aumento el espacio entre las líneas para facilitar la lectura */
            line-height: 1.6;


        }

        /* Se le da una apariencia de botón al enlace */
        .boton-hero {
            
            /* Se permite que el enlace tenga forma de botón */
            display: inline-block;

            /* Se agrega espacio dentro del botón */
            padding: 18px 42px;

            /* Se coloca el fondo turquesa del botón */
            background-color: #14b8d4;

            /* Coloco el texto en color blanco */
            color: white;

            /* Defino el tamaño del texto */
            font-size: 1.1rem;

            /* Se coloca el texto en negrita */
            font-weight: bold;

            /* Redondeo bastante las esquinas */
            border-radius: 40px;            

            /* Se quita la línea inferior del enlace */
            text-decoration: none;

            /* Se muestra la mano cuando paso el cursor */
            cursor: pointer;

            /* Y evito que el botón herede la sombra del texto */
            text-shadow: none;

            /* Se agrega una transición suave */
            transition:background-color var(--transicion-suave),
            transform var(--transicion-suave);
        }

        /* Ahora que cambie el botón cuando paso el cursor */
        .boton-hero:hover {
            
            /* Se cambia a un turquesa más oscuro */
            background-color: #0891b2;

            /* Se mueve el botón un poco hacia arriba */
            transform: translateY(-3px);
        }

        /* Se adacta el diseño para tabletas */
        @media (max-width: 768px) {

            /* Se ajusta la sección principal del HERO para tabletas */
            .hero {

                /* Se reduce la altura mínima del HERO */
                min-height: 520px;

                /*  Se agrega 35 píxeles de espacio arriba y abajo
                y 24 píxeles a los lados*/
                padding: 35px 24px;

                /*Se ajusta la posición para que los monumentos
                sigan visibles en tablet */
                background-position: center center;
            }

            /* Se ajusto el título para que no quede demasiado grande */
            .titulo-hero {

                /* Se redijo el tamaño del título */
                font-size: 3rem;
            }

            /* Se ajusta la descripción para que se lea mejor en tablet */
            .descripcion-hero {

                /* Se redujo el tamaño del texto descriptivo */
                font-size: 1.1rem;
            }
        }

        /* Se adacta el diseño para celulares*/
        @media (max-width: 480px) {

            /* Aquí modifico la sección principal del hero*/
            .hero {

                /* Aqui se le da una altura mínima de 500 píxeles*/
                min-height: 500px;

                /* Aqui agrego 30 pixeles de espacio arriba y abajo
                y 20 pixeles a los lados*/
                padding: 30px 20px;

                /*Ahora en celular muevo un poco la imagen
                para mostrar mejor su parte central*/
                background-position: 58% center;
            }

            /* Aquí adapto el título principal para celular*/
            .titulo-hero {

                /* Aqui se deja un espacio de 22 píxeles debajo del título*/
                margin-bottom: 22px;

                /* Aqui se reduce el tamaño del título para pantallas pequeñas */
                font-size: 2.3rem;
            }

            /* Aquí adapto la descripción para celular*/
            .descripcion-hero {

                /* Aqui dejo un espacio de 28 píxeles debajo de la descripción */
                margin-bottom: 28px;

                /* Aqui reduzco el tamaño del texto a una medida más cómoda */
                font-size: 1rem;
            }

            /* Aquí Se adapto el botón para celular */
            .boton-hero {

                /* Aqui se hace el botón pueda ocupar todo el ancho disponible */
                width: 100%;

                /* Aqui evito que el botón sea más ancho de 300 píxeles */
                max-width: 300px;

                /* Agrego 16 píxeles de espacio arriba y abajo, y 
                20 píxeles a los lados*/
                padding: 16px 20px;

                /* Aqui se reduce el tamaño del texto del botón */
                font-size: 1rem;

                /* Aqui se define el texto dentro del botón */
                text-align: center;
            }
        }

        
    </style>

    <!-- Aqui cierro la </style> del HERO VIAJAYA X LIZETH -->
    <!------------------------------------------------------------->




</head>

<body>

    <!------------------------------------------------------------->
    <!-- Aqui inicio mi seccion del HERO VIAJAYA X LIZETH 
     utilizando la etiqueta semantica section por que nos dividimos x
     secciones como equipo-->

    <section class="hero">

        <!-- Aqui creo un contenerdor con <div> para agrupar el titulo, la
         descripción y el botón -->
        <div class="contenedor-hero">

            <!-- Aqui creo el titulo de la sección con h1 y
             por se el titulo principal de la página -->
            <h1 class="titulo-hero">¡Descubre Tu destino Soñado!</h1>

            <!-- Aqui creo la descripción de la sección con un
             parrafo que explica lo que ofrecemos como tienda de
             viajes -->
            <p class="descripcion-hero">Aprovecha nuestros paquetes turísticos exclusivos con todo
                incluido. ¡Viaja seguro y al mejor precio!</p>

            <!-- Aqui creo un botón que redirige a otra página que seria
             la sección paquetes-->
            <a class="boton-hero" href="#paquetes">
                Ver Ofertas Disponibles
            </a>

            <!-- Aqui cierro el contenedor con </div> -->
        </div>


    </section>
    <!-- Aqui cierro la </section> del HERO VIAJAYA X LIZETH -->
    


</body>

</html>
